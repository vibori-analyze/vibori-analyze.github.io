name: Build and deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          repository: vibori-analyze/vibori
          ref: master

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check project
        run: |
          output="$(nix run .#check 2>&1)" || {
            printf '%s\n' "$output"
            summary="$(printf '%s' "$output" | tail -n 20 | tr '\n' ' ')"
            echo "::error title=Project check failed::$summary"
            exit 1
          }
          printf '%s\n' "$output"

      - name: Build data index
        run: nix run .#build-index

      - name: Generate static site
        env:
          NUXT_APP_BASE_URL: /
        run: nix run .#generate

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
